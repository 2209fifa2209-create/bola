<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บ้านทีวี - BaanTV Sports & Entertainment</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js สำหรับสตรีม m3u8 ทั้ง http และ https -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome ไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .neon-glow { box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
        .channel-card:active { transform: scale(0.97); }
        /* สไตล์โหมดเต็มหน้าจอจำลอง (Pseudo-Fullscreen สำหรับมือถือหรือเบราว์เซอร์ที่จำกัด) */
        .pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            z-index: 99999 !important;
            background: #000 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
        }
        .pseudo-fullscreen video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ส่วนหัวแอป -->
    <header class="bg-gradient-to-r from-gray-900 via-blue-950 to-gray-900 border-b border-red-600/30 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-red-600 to-amber-500 p-2.5 rounded-xl shadow-md neon-glow">
                    <i class="fa-solid fa-crown text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
                        บ้านทีวี <span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full font-normal">HD / Live</span>
                    </h1>
                    <p class="text-xs text-gray-400">รวมความบันเทิงและกีฬาครบวงจร (HTTP/HTTPS)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddChannelModal()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 shadow-md transition">
                    <i class="fa-solid fa-plus"></i> เพิ่มช่อง
                </button>
            </div>
        </div>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-6 space-y-6">

        <!-- ส่วนเครื่องเล่นวิดีโอหลัก -->
        <div id="player-container-wrapper" class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 relative group">
            <!-- แถบควบคุมมุมขวาบนในจอเล่น -->
            <div class="absolute top-3 right-3 z-30 flex items-center gap-2 opacity-90 group-hover:opacity-100 transition">
                <button onclick="rotateVideo()" title="หมุนจอ 90 องศา" class="bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-lg text-xs backdrop-blur border border-white/20 flex items-center gap-1 shadow">
                    <i class="fa-solid fa-rotate"></i> หมุนจอ 90°
                </button>
                <button onclick="toggleFullscreen()" title="ขยายเต็มจอ" class="bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-lg text-xs backdrop-blur border border-white/20 flex items-center gap-1 shadow">
                    <i class="fa-solid fa-expand"></i> เต็มจอ
                </button>
            </div>

            <!-- กล่องวิดีโอ -->
            <div id="video-box" class="relative w-full aspect-video bg-black flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" playsinline controls autoplay></video>
                
                <!-- ปุ่มแตะเพื่อเปิดเสียงกรณี Autoplay บล็อก -->
                <div id="unmute-overlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center cursor-pointer hidden z-20" onclick="forceUnmute()">
                    <div class="bg-red-600 text-white p-4 rounded-full shadow-2xl mb-2 animate-bounce">
                        <i class="fa-solid fa-volume-high text-2xl"></i>
                    </div>
                    <span class="text-white font-medium text-sm">แตะเพื่อเปิดเสียง / เล่นต่อ</span>
                </div>

                <!-- ป้ายแสดงชื่อช่องกำลังเล่น -->
                <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-2 z-20 pointer-events-none">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="current-playing-title" class="text-xs font-medium text-white">เลือกช่องด้านล่างเพื่อรับชม</span>
                </div>
            </div>
        </div>

        <!-- หมวดหมู่ช่องรายการ -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="category-tabs">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-red-600 text-white whitespace-nowrap shadow transition">ทั้งหมด</button>
            <button onclick="filterCategory('digital')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">ดิจิตอลทีวี</button>
            <button onclick="filterCategory('mono')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">monomax</button>
            <button onclick="filterCategory('tv')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">ช่องทีวี</button>
            <button onclick="filterCategory('movie')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">หนัง</button>
            <button onclick="filterCategory('series')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">ซีรีย์</button>
            <button onclick="filterCategory('cartoon')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">การ์ตูน</button>
            <button onclick="filterCategory('variety')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium bg-gray-900 border border-gray-800 text-gray-300 hover:text-white whitespace-nowrap transition">วาไรตี้</button>
        </div>

        <!-- รายการช่อง (Grid) -->
        <div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list text-red-500"></i> รายการช่องสตรีมมิ่ง (HTTP & HTTPS)
                </h2>
                <span id="channel-count" class="text-xs text-gray-500">0 ช่อง</span>
            </div>
            <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <!-- ข้อมูลช่องจะถูกเรนเดอร์ด้วย JavaScript -->
            </div>
        </div>
    </main>

    <!-- โมเดลเพิ่ม/แก้ไขช่อง -->
    <div id="channel-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-base font-bold text-white">เพิ่มช่องสตรีมมิ่งใหม่</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="edit-index" value="-1">
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">ชื่อช่อง</label>
                    <input type="text" id="channel-name" placeholder="เช่น บอลสด พรีเมียร์ลีก" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">หมวดหมู่</label>
                    <select id="channel-cat" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                        <option value="sport">ดิจิตอลทีวี</option>
                        <option value="mono">monomax</option>
                        <option value="tv">ช่องทีวี</option>
                        <option value="movie">หนัง</option>
                        <option value="series">ซีรีย์</option>
                        <option value="cartoon">การ์ตูน</option>
                        <option value="variety">วาไรตี้</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">ลิงก์สตรีม (รองรับ https:// หรือ http:// และ .m3u8 / .mp4)</label>
                    <input type="text" id="channel-url" placeholder="https:// หรือ http://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">ลิงก์รูปโลโก้ (ถ้ามี)</label>
                    <input type="text" id="channel-logo" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-xs transition">ยกเลิก</button>
                <button onclick="saveChannel()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-medium transition">บันทึก</button>
            </div>
        </div>
    </div>
    <script>
        // รายการช่องเริ่มต้น (รองรับทั้ง http และ https)
        let channels = JSON.parse(localStorage.getItem('baantv_channels')) || [
            { name: "CH3", cat: "digital", url: "https://edge-2.m-fixer.net:8092/stream/ais/3hd/master.m3u8", logo: "https://www.fileinw.com/postor/20240418191821ch3hd.jpg" },
            { name: "บอลสด ช่อง 1 ", cat: "sport", url: "https://edge-2.m-fixer.net:8092/stream/ais/aisplay41/master.m3u8", logo: "https://img.icons8.com/color/96/football--v1.png" },
            { name: "บอลสด ช่อง 2 (HTTP Test)", cat: "sport", url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", logo: "https://img.icons8.com/color/96/soccer-ball.png" },
            { name: "ช่องทีวี 3 HD", cat: "tv", url: "https://cph-p2s-kfi.akamaized.net/hls/live/2000341/test/master.m3u8", logo: "https://img.icons8.com/color/96/tv.png" },
            { name: "ช่องหนังยอดฮิต", cat: "movie", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", logo: "https://img.icons8.com/color/96/clapperboard.png" }
        ];

        let currentCategory = 'all';
        let hlsInstance = null;
        let isRotated = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderChannels();
            if (channels.length > 0) {
                playStream(channels[0].url, channels[0].name);
            }
        });

        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '';
            
            const filtered = currentCategory === 'all' 
                ? channels 
                : channels.filter(c => c.cat === currentCategory);

            document.getElementById('channel-count').innerText = `${filtered.length} ช่อง`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 text-xs">ไม่พบช่องรายการในหมวดหมู่นี้</div>`;
                return;
            }

            filtered.forEach((ch, idx) => {
                const originalIndex = channels.indexOf(ch);
                const card = document.createElement('div');
                card.className = `channel-card bg-gray-900 border border-gray-800 hover:border-red-600/50 rounded-2xl p-3 flex flex-col items-center justify-between cursor-pointer transition shadow hover:shadow-lg relative group`;
                
                card.innerHTML = `
                    <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition flex gap-1 z-10">
                        <button onclick="event.stopPropagation(); editChannel(${originalIndex})" class="bg-blue-600/80 hover:bg-blue-600 text-white w-6 h-6 rounded-lg text-xs flex items-center justify-center"><i class="fa-solid fa-pen text-[10px]"></i></button>
                        <button onclick="event.stopPropagation(); deleteChannel(${originalIndex})" class="bg-red-600/80 hover:bg-red-600 text-white w-6 h-6 rounded-lg text-xs flex items-center justify-center"><i class="fa-solid fa-trash text-[10px]"></i></button>
                    </div>
                    <div class="w-14 h-14 bg-gray-950 rounded-xl p-2 mb-2 flex items-center justify-center border border-gray-800 shadow-inner">
                        <img src="${ch.logo || 'https://img.icons8.com/color/96/tv.png'}" alt="${ch.name}" class="w-full h-full object-contain" onerror="this.src='https://img.icons8.com/color/96/tv.png'">
                    </div>
                    <span class="text-xs font-medium text-center text-gray-200 line-clamp-2 mb-3">${ch.name}</span>
                    <button onclick="playStream('${ch.url}', '${ch.name}')" class="w-full bg-red-600 hover:bg-red-700 text-white py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-play text-[10px]"></i> รับชม
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'text-white');
                btn.classList.add('bg-gray-900', 'border', 'border-gray-800', 'text-gray-300');
            });
            event.currentTarget.classList.remove('bg-gray-900', 'border', 'border-gray-800', 'text-gray-300');
            event.currentTarget.classList.add('bg-red-600', 'text-white');
            renderChannels();
        }

        function playStream(url, title) {
            const video = document.getElementById('videoPlayer');
            document.getElementById('current-playing-title').innerText = title;
            document.getElementById('unmute-overlay').classList.add('hidden');

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // จัดการลิงก์ http หากหน้าเว็บเป็น https (ระบบแปลงหรือลองเล่นอัตโนมัติ)
            let playUrl = url.trim();

            if (playUrl.includes('.m3u8') || playUrl.includes('m3u')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(playUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => showUnmuteOverlay());
                    });
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            console.warn("HLS Error, trying direct play...");
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = playUrl;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(() => showUnmuteOverlay());
                    });
                }
            } else {
                video.src = playUrl;
                video.load();
                video.play().catch(() => showUnmuteOverlay());
            }
        }

        function showUnmuteOverlay() {
            document.getElementById('unmute-overlay').classList.remove('hidden');
        }

        function forceUnmute() {
            const video = document.getElementById('videoPlayer');
            video.muted = false;
            video.play();
            document.getElementById('unmute-overlay').classList.add('hidden');
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('video-box');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen().catch(() => wrapper.classList.toggle('pseudo-fullscreen'));
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                } else {
                    wrapper.classList.toggle('pseudo-fullscreen');
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                wrapper.classList.remove('pseudo-fullscreen');
            }
        }

        function rotateVideo() {
            isRotated = !isRotated;
            const videoBox = document.getElementById('video-box');
            if (isRotated) {
                videoBox.style.transform = "rotate(90deg)";
                videoBox.style.width = "100vh";
                videoBox.style.height = "100vw";
            } else {
                videoBox.style.transform = "none";
                videoBox.style.width = "100%";
                videoBox.style.height = "auto";
            }
        }

        function openAddChannelModal() {
            document.getElementById('modal-title').innerText = "เพิ่มช่องสตรีมมิ่งใหม่";
            document.getElementById('edit-index').value = "-1";
            document.getElementById('channel-name').value = "";
            document.getElementById('channel-url').value = "";
            document.getElementById('channel-logo').value = "";
            document.getElementById('channel-modal').classList.remove('hidden');
        }

        function editChannel(index) {
            const ch = channels[index];
            document.getElementById('modal-title').innerText = "แก้ไขข้อมูลช่อง";
            document.getElementById('edit-index').value = index;
            document.getElementById('channel-name').value = ch.name;
            document.getElementById('channel-cat').value = ch.cat;
            document.getElementById('channel-url').value = ch.url;
            document.getElementById('channel-logo').value = ch.logo || "";
            document.getElementById('channel-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('channel-modal').classList.add('hidden');
        }

        function saveChannel() {
            const index = parseInt(document.getElementById('edit-index').value);
            const name = document.getElementById('channel-name').value.trim();
            const cat = document.getElementById('channel-cat').value;
            const url = document.getElementById('channel-url').value.trim();
            const logo = document.getElementById('channel-logo').value.trim();

            if (!name || !url) {
                alert("กรุณากรอกชื่อช่องและลิงก์สตรีมให้ครบถ้วน");
                return;
            }

            const newChannelData = { name, cat, url, logo };

            if (index === -1) {
                channels.push(newChannelData);
            } else {
                channels[index] = newChannelData;
            }

            localStorage.setItem('baantv_channels', JSON.stringify(channels));
            closeModal();
            renderChannels();
            playStream(url, name);
        }

        function deleteChannel(index) {
            if (confirm("คุณต้องการลบช่องนี้ใช่หรือไม่?")) {
                channels.splice(index, 1);
                localStorage.setItem('baantv_channels', JSON.stringify(channels));
                renderChannels();
            }
        }
    </script>
</body>
</html>
