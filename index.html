<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO TV - ดูบอลสดออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="bg-[#121214] border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-white text-black font-black px-3 py-1 rounded flex flex-col items-center leading-none shadow">
                <span class="text-sm tracking-tighter">DINO</span>
                <span class="text-[9px] text-orange-600 tracking-widest font-bold">TV LIVE</span>
            </div>
            <span class="hidden sm:inline text-xs text-zinc-400">ระบบดูบอลสด & ทีวีออนไลน์</span>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
            <!-- Search Input -->
            <div class="relative">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อช่อง..." 
                    class="bg-zinc-800 text-sm text-white placeholder-zinc-400 rounded-full pl-3 pr-8 py-1.5 w-36 sm:w-56 focus:outline-none focus:ring-1 focus:ring-orange-500">
                <svg class="w-4 h-4 text-zinc-400 absolute right-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <!-- Reset Storage Button -->
            <button onclick="resetChannels()" title="รีเซ็ตลิงก์เริ่มต้น" class="p-2 text-zinc-400 hover:text-orange-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Left Sidebar Categories (DINO TV Style) -->
        <aside class="w-36 sm:w-52 bg-[#202024] border-r border-zinc-800 p-2 flex flex-col gap-1.5 overflow-y-auto shrink-0" id="categorySidebar">
            <!-- Categories will be injected by JS -->
        </aside>

        <!-- Right Main Area -->
        <main class="flex-1 flex flex-col overflow-y-auto bg-[#18181b] p-3 sm:p-5">
            
            <!-- Video Player & Direct M3U8 Editor Section (Hidden until a channel is clicked or toggled) -->
            <div id="playerSection" class="hidden mb-5 bg-[#121214] border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between bg-zinc-900 px-4 py-2 border-b border-zinc-800">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                        <h2 id="activeChannelTitle" class="font-semibold text-sm sm:text-base text-white">กำลังรับชม: -</h2>
                    </div>
                    <button onclick="closePlayer()" class="text-xs bg-zinc-800 hover:bg-red-600 text-white px-2.5 py-1 rounded transition">
                        ✕ ปิดจอ
                    </button>
                </div>

                <!-- Video Container -->
                <div class="relative w-full aspect-video max-h-[420px] bg-black flex items-center justify-center">
                    <video id="videoPlayer" class="w-full h-full object-contain" controls playsinline></video>
                    <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 text-center p-4">
                        <p class="text-orange-500 font-semibold text-base mb-1">ยังไม่ได้ใส่ลิงก์ .m3u8 สำหรับช่องนี้</p>
                        <p class="text-zinc-400 text-xs">วางลิงก์สตรีม .m3u8 ในช่องด้านล่างแล้วกด "บันทึกและเล่นทันที"</p>
                    </div>
                </div>

                <!-- Direct M3U8 Link Editor -->
                <div class="p-3 bg-zinc-900/90 border-t border-zinc-800 flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
                    <span class="text-xs text-orange-400 font-medium shrink-0">ลิงก์ M3U8:</span>
                    <input type="text" id="m3u8Input" placeholder="วางลิงก์ https://.../playlist.m3u8 ที่นี่" 
                        class="flex-1 bg-zinc-950 border border-zinc-700 rounded px-3 py-1.5 text-xs sm:text-sm text-white focus:outline-none focus:border-orange-500">
                    <button onclick="saveAndPlayStream()" class="bg-orange-600 hover:bg-orange-500 text-white font-medium text-xs sm:text-sm px-4 py-1.5 rounded transition shrink-0">
                        ▶ บันทึกและเล่นทันที
                    </button>
                </div>
            </div>

            <!-- Category Header -->
            <div class="flex items-center justify-between mb-3">
                <h1 id="currentCategoryTitle" class="text-base sm:text-lg font-bold text-orange-500">ช่องCH3</h1>
                <span id="channelCount" class="text-xs text-zinc-400">0 ช่อง</span>
            </div>

            <!-- Channels Grid -->
            <div id="channelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 pb-10">
                <!-- Channel Cards will be injected by JS -->
            </div>

        </main>
    </div>

    <script>
        // ==========================================
        // 1. หมวดหมู่ทั้งหมด (ไม่มีช่องบอลสดแนะนำ)
        // ==========================================
        const categories = [
            { id: 'digital', name: 'ช่องทีวีดิจิตอล' },
            { id: 'bein', name: 'ช่องBEIN' },
            { id: 'truesport', name: 'ช่องทรูสปอร์ต' },
            { id: 'thaiball', name: 'ช่องบอลไทย' },
            { id: 'monomax', name: 'ช่องMONOMAX' },
            { id: 'events', name: 'กีฬา EVENTS' },
            { id: 'sport', name: 'SPORT' },
            { id: 'sportsworld', name: 'SPORTS WORLD' }
            
        ];

        // ==========================================
        // 2. ฐานข้อมูลช่องรายการ (ตัด mirrors ออกแล้ว ใส่ url ได้โดยตรง)
        // ==========================================
        const defaultChannelsData = [
            // หมวด ช่องBEIN
            { id: 'bein1', name: 'beIN SPORTS 1', category: 'bein', badge: 'HD', color: 'from-purple-900 to-zinc-900', url: 'https://edge-2.m-fixer.net:8092/stream/ais/3hd/master.m3u8' },
            { id: 'bein2', name: 'beIN SPORTS 2', category: 'bein', badge: 'HD', color: 'from-purple-900 to-zinc-900', url: '' },
            { id: 'bein3', name: 'beIN SPORTS 3', category: 'bein', badge: 'HD', color: 'from-purple-900 to-zinc-900', url: '' },
            { id: 'bein4', name: 'beIN SPORTS 4', category: 'bein', badge: 'HD', color: 'from-purple-900 to-zinc-900', url: '' },
            { id: 'bein5', name: 'beIN SPORTS 5', category: 'bein', badge: 'HD', color: 'from-purple-900 to-zinc-900', url: '' },

            // หมวด ช่องทรูสปอร์ต
            { id: 'ts1', name: 'True Premier Football 1', category: 'truesport', badge: 'FHD', color: 'from-red-900 to-zinc-900', url: '' },
            { id: 'ts2', name: 'True Premier Football 2', category: 'truesport', badge: 'FHD', color: 'from-red-900 to-zinc-900', url: '' },
            { id: 'ts3', name: 'True Premier Football 3', category: 'truesport', badge: 'HD', color: 'from-red-900 to-zinc-900', url: '' },
            { id: 'ts4', name: 'True Sports 2', category: 'truesport', badge: 'HD', color: 'from-red-800 to-zinc-900', url: '' },
            { id: 'ts5', name: 'True Sports 3', category: 'truesport', badge: 'HD', color: 'from-red-800 to-zinc-900', url: '' },

            // หมวด ช่องบอลไทย
            { id: 'tb1', name: 'Ball Thai 1', category: 'thaiball', badge: 'LIVE', color: 'from-blue-900 to-zinc-900', url: '' },
            { id: 'tb2', name: 'Ball Thai 2', category: 'thaiball', badge: 'LIVE', color: 'from-blue-900 to-zinc-900', url: '' },
            { id: 'tb3', name: 'Ball Thai 3', category: 'thaiball', badge: 'LIVE', color: 'from-blue-900 to-zinc-900', url: '' },

            // หมวด ช่องMONOMAX
            { id: 'mono1', name: 'MONOMAX Sport 1', category: 'monomax', badge: 'HD', color: 'from-orange-900 to-zinc-900', url: '' },
            { id: 'mono2', name: 'MONOMAX Sport 2', category: 'monomax', badge: 'HD', color: 'from-orange-900 to-zinc-900', url: '' },

            // หมวด กีฬา EVENTS
            { id: 'ev1', name: 'LIVE EVENT 01', category: 'events', badge: 'EVENT', color: 'from-emerald-900 to-zinc-900', url: '' },
            { id: 'ev2', name: 'LIVE EVENT 02', category: 'events', badge: 'EVENT', color: 'from-emerald-900 to-zinc-900', url: '' },

            // หมวด SPORT
            { id: 'sp1', name: 'SPOTV 1', category: 'sport', badge: 'HD', color: 'from-sky-900 to-zinc-900', url: '' },
            { id: 'sp2', name: 'SPOTV 2', category: 'sport', badge: 'HD', color: 'from-sky-900 to-zinc-900', url: '' },
            { id: 'sp3', name: 'T Sports 7', category: 'sport', badge: 'HD', color: 'from-amber-900 to-zinc-900', url: '' },

            // หมวด SPORTS WORLD
            { id: 'sw1', name: 'Sky Sports Main Event', category: 'sportsworld', badge: 'UK', color: 'from-indigo-900 to-zinc-900', url: '' },
            { id: 'sw2', name: 'TNT Sports 1', category: 'sportsworld', badge: 'UK', color: 'from-pink-900 to-zinc-900', url: '' },

            // หมวด ช่องทีวีดิจิตอล
            { id: 'ch3', name: 'CH3 HD', category: 'digital', badge: '33', color: 'from-zinc-800 to-zinc-950', url: '' },
            { id: 'ch7', name: 'CH7 HD', category: 'digital', badge: '35', color: 'from-zinc-800 to-zinc-950', url: 'https://live-cdn.ch7.com/out/v1/eafeb02c55b64a15b278b1e66c7fc776/playlist_9.m3u8' },
            { id: 'thairath', name: 'Thairath TV', category: 'digital', badge: '32', color: 'from-zinc-800 to-zinc-950', url: '' },
            { id: 'pptv', name: 'PPTV HD 36', category: 'digital', badge: '36', color: 'from-zinc-800 to-zinc-950', url: '' }
        ];

        // โหลดข้อมูลจาก LocalStorage (ถ้าเคยบันทึกไว้) หรือใช้ค่าเริ่มต้น
        let channelsData = JSON.parse(localStorage.getItem('dino_football_channels')) || defaultChannelsData;
        let currentCategory = 'bein'; // เริ่มต้นที่หมวด ช่องBEIN
        let activeChannelId = null;
        let hls = null;

        // แสดงแถบหมวดหมู่ด้านซ้าย
        function renderCategories() {
            const sidebar = document.getElementById('categorySidebar');
            sidebar.innerHTML = categories.map(cat => {
                const isActive = cat.id === currentCategory;
                return `
                    <button onclick="selectCategory('${cat.id}')" 
                        class="w-full text-left px-3 py-2.5 rounded-md text-xs sm:text-sm font-medium transition-all
                        ${isActive 
                            ? 'bg-gradient-to-r from-orange-600 to-orange-500 text-white shadow-md' 
                            : 'bg-[#2a2a30] text-zinc-300 hover:bg-zinc-700 hover:text-white'}">
                        ${cat.name}
                    </button>
                `;
            }).join('');
        }

        // แสดงรายการช่องในการ์ด
        function renderChannels(searchQuery = '') {
            const grid = document.getElementById('channelsGrid');
            const catObj = categories.find(c => c.id === currentCategory);
            document.getElementById('currentCategoryTitle').textContent = searchQuery ? `ผลการค้นหา: "${searchQuery}"` : catObj.name;

            const filtered = channelsData.filter(ch => {
                if (searchQuery) {
                    return ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                }
                return ch.category === currentCategory;
            });

            document.getElementById('channelCount').textContent = `${filtered.length} ช่อง`;

            grid.innerHTML = filtered.map(ch => {
                const hasLink = ch.url && ch.url.trim() !== '';
                return `
                    <div onclick="openChannel('${ch.id}')" 
                        class="group cursor-pointer bg-[#242429] border ${activeChannelId === ch.id ? 'border-orange-500 ring-1 ring-orange-500' : 'border-zinc-800 hover:border-orange-500/70'} rounded-lg overflow-hidden flex flex-col transition-all shadow-lg">
                        
                        <!-- Logo / Poster Box -->
                        <div class="relative aspect-[16/10] bg-gradient-to-br ${ch.color} flex flex-col items-center justify-center p-3">
                            <span class="absolute top-2 right-2 text-[10px] font-bold px-1.5 py-0.5 rounded ${hasLink ? 'bg-emerald-600 text-white' : 'bg-zinc-800/90 text-zinc-400'}">
                                ${hasLink ? '● พร้อมเล่น' : ch.badge}
                            </span>
                            <div class="text-center font-extrabold text-white text-sm sm:text-base tracking-wide drop-shadow group-hover:scale-105 transition-transform">
                                ${ch.name}
                            </div>
                        </div>

                        <!-- Bottom Channel Title Bar (DINO TV Style) -->
                        <div class="bg-[#1c1c21] px-2 py-2 text-center border-t border-zinc-800">
                            <p class="text-xs sm:text-sm font-medium text-zinc-200 truncate group-hover:text-orange-400 transition-colors">
                                ${ch.name}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // เปลี่ยนหมวดหมู่
        function selectCategory(catId) {
            currentCategory = catId;
            document.getElementById('searchInput').value = '';
            renderCategories();
            renderChannels();
        }

        // เปิดช่องและเล่นสตรีม
        function openChannel(channelId) {
            const channel = channelsData.find(c => c.id === channelId);
            if (!channel) return;

            activeChannelId = channelId;
            document.getElementById('playerSection').classList.remove('hidden');
            document.getElementById('activeChannelTitle').textContent = `กำลังรับชม: ${channel.name}`;
            document.getElementById('m3u8Input').value = channel.url || '';

            renderChannels(document.getElementById('searchInput').value);
            playM3U8(channel.url);
            
            // เลื่อนจอขึ้นบนสุดเพื่อให้เห็นวิดีโอ
            document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ฟังก์ชันเล่นไฟล์ .m3u8
        function playM3U8(url) {
            const video = document.getElementById('videoPlayer');
            const overlay = document.getElementById('playerOverlay');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (!url || url.trim() === '') {
                video.pause();
                video.removeAttribute('src');
                overlay.classList.remove('hidden');
                return;
            }

            overlay.classList.add('hidden');

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url.trim());
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url.trim();
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => {});
                });
            }
        }

        // บันทึกลิงก์ใหม่และเล่นทันที
        function saveAndPlayStream() {
            if (!activeChannelId) return;
            const newUrl = document.getElementById('m3u8Input').value.trim();
            const index = channelsData.findIndex(c => c.id === activeChannelId);
            if (index !== -1) {
                channelsData[index].url = newUrl;
                localStorage.setItem('dino_football_channels', JSON.stringify(channelsData));
                renderChannels(document.getElementById('searchInput').value);
                playM3U8(newUrl);
            }
        }

        // ปิดหน้าจอเล่นวิดีโอ
        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            if (hls) hls.destroy();
            document.getElementById('playerSection').classList.add('hidden');
            activeChannelId = null;
            renderChannels(document.getElementById('searchInput').value);
        }

        // รีเซ็ตข้อมูลกลับเป็นค่าเริ่มต้นในโค้ด
        function resetChannels() {
            if (confirm('ต้องการรีเซ็ตลิงก์ทั้งหมดกลับเป็นค่าเริ่มต้นในโค้ดใช่หรือไม่?')) {
                localStorage.removeItem('dino_football_channels');
                channelsData = JSON.parse(JSON.stringify(defaultChannelsData));
                closePlayer();
                renderChannels();
            }
        }

        // ระบบค้นหา
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderChannels(e.target.value);
        });

        // เริ่มต้นทำงาน
        renderCategories();
        renderChannels();
    </script>
</body>
</html>
