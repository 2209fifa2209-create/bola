<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FREE IPTV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #121212; color: #fff; overflow: hidden; }
        
        /* App Layout */
        #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; }
        
        /* Top Bar */
        .top-bar { background-color: #1a1a1a; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; font-size: 14px; flex-wrap: wrap; gap: 8px; }
        .top-title { color: #f1c40f; font-weight: bold; }
        .top-menu { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #ccc; }
        .top-menu span { cursor: pointer; }
        .top-menu span:hover { color: #fff; }
        
        /* Custom Link Bar */
        .link-bar { background-color: #222; padding: 6px 15px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
        .link-bar input { flex: 1; padding: 6px 10px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 13px; }
        .link-bar button { padding: 6px 12px; background: #e74c3c; border: none; color: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }
        .link-bar button.secondary { background: #3498db; }

        /* Main Body */
        .main-body { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 180px; background-color: #181818; border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0; }
        .cat-item { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #222; cursor: pointer; color: #bbb; }
        .cat-item:hover, .cat-item.active { background-color: #2a2a2a; color: #f1c40f; border-left: 4px solid #f1c40f; }

        /* Content Grid */
        .content { flex: 1; background-color: #ffffff; overflow-y: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .channel-card { background: #f9f9f9; border: 2px solid #3b5998; border-radius: 4px; padding: 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: transform 0.1s; }
        .channel-card:active { transform: scale(0.96); }
        .channel-logo { width: 100%; height: 60px; background: #000; border-radius: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; margin-bottom: 4px; }
        .channel-logo img { width: 100%; height: 100%; object-fit: contain; }
        .channel-name { font-size: 11px; color: #333; word-break: break-all; line-height: 1.2; max-height: 28px; overflow: hidden; font-weight: bold; }

        /* Fullscreen Player Overlay */
        #player-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; z-index: 99999; display: none; flex-direction: column; }
        #player-overlay.active { display: flex; }
        
        .video-container { flex: 1; position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        video.fit { object-fit: contain; }
        video.fill { object-fit: cover; }
        video.stretch { object-fit: fill; }

        /* HUD Controls */
        .player-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px); transition: opacity 0.3s; opacity: 1; z-index: 100000; }
        .player-hud.hidden { opacity: 0; pointer-events: none; }
        .hud-top, .hud-bottom { pointer-events: auto; background: rgba(0, 0, 0, 0.85); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; backdrop-filter: blur(5px); }
        .hud-top { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .hud-bottom { border-top: 1px solid rgba(255,255,255,0.1); }
        
        .hud-btn { background: rgba(255,255,255,0.25); border: none; color: #fff; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .hud-btn:hover { background: rgba(255,255,255,0.4); }
        .hud-btn.danger { background: #e74c3c; }
        .hud-btn.warning { background: #e67e22; color: #fff; }
        .hud-btn.primary { background: #27ae60; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-title">ชื่อ : [ FREE IPTV ]</div>
            <div class="top-menu">
                <span onclick="alert('กำลังใช้งาน TV ™')">📺 TV ™</span>
                <span onclick="alert('หมวด ดูหนัง ™')">🎬 ดูหนัง ™</span>
                <span onclick="alert('หมวด ดูซีรี่ย์ ™')">🍿 ดูซีรี่ย์ ™</span>
                <span onclick="alert('หมวด ดูสารคดี ™')">🌍 ดูสารคดี ™</span>
                <span onclick="if(confirm('ต้องการออกจากแอปใช่หรือไม่?')) window.close();" style="color:#e74c3c;">🚪 ออก</span>
            </div>
        </div>

        <!-- Link Bar -->
        <div class="link-bar">
            <input type="text" id="customStreamUrl" placeholder="วางลิงก์ทุกไฟล์ (.m3u8, .mp4, .mkv, .ts, .mov...) ที่นี่...">
            <button class="primary" onclick="playCustomLink()">▶ เล่นลิงก์เต็มจอ</button>
            <button class="secondary" onclick="addM3UPlaylist()">📡 เพิ่ม M3U</button>
        </div>

        <!-- Main Body -->
        <div class="main-body">
            <!-- Sidebar Categories -->
            <div class="sidebar" id="sidebar">
                <div class="cat-item active" onclick="filterCat('digital', this)">ดิจิตอลทีวี ™</div>
                <div class="cat-item" onclick="filterCat('cartoon', this)">การ์ตูน ™</div>
                <div class="cat-item" onclick="filterCat('thaisport', this)">กีฬาไทย ™</div>
                <div class="cat-item" onclick="filterCat('globalsport', this)">กีฬาต่างประเทศ ™</div>
                <div class="cat-item" onclick="filterCat('movie', this)">ภาพยนตร์ ™</div>
                <div class="cat-item" onclick="filterCat('docu', this)">สารคดี ™</div>
                <div class="cat-item" onclick="filterCat('news', this)">NEWS ™</div>
                <div class="cat-item" onclick="filterCat('test', this)">Test ™</div>
            </div>

            <!-- Content Channels Grid -->
            <div class="content">
                <div class="grid" id="channelGrid"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Video Player Overlay -->
    <div id="player-overlay">
        <div class="video-container" id="videoContainer" onclick="toggleHud()">
            <video id="videoPlayer" playsinline webkit-playsinline x-webkit-airplay="allow" controls></video>
            
            <!-- HUD Overlay Controls -->
            <div class="player-hud" id="playerHud" onclick="event.stopPropagation()">
                <div class="hud-top">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="hud-btn warning" onclick="closePlayer()">◀ กลับ</button>
                        <span id="currentPlayingTitle" style="font-weight: bold; color: #f1c40f; font-size: 14px;">กำลังเล่น: สื่อวิดีโอ</span>
                    </div>
                    <button class="hud-btn danger" onclick="closePlayer()">✕ ปิด</button>
                </div>
                <div class="hud-bottom">
                    <button class="hud-btn" onclick="toggleNativeFullscreen()">📺 เต็มจอ iOS (Native)</button>
                    <button class="hud-btn" onclick="rotatePlayer()">🔄 หมุนจอ 90°</button>
                    <button class="hud-btn" onclick="changeAspectRatio()">📐 สัดส่วน (Fit/Fill)</button>
                    <button class="hud-btn primary" onclick="promptChangeLink()">✏️ แก้ไขลิงก์ช่องนี้</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let channelsData = {
            digital: [
                { name: 'CH3', url: 'https://edge-2.m-fixer.net:8092/stream/ais/3hd/master.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/2/2f/Channel_3_Thailand_Logo.svg/200px-Channel_3_Thailand_Logo.svg.png' },
                { name: 'CH3™(MP4 File)', url: 'http://3bb.engatetv.com:25461/hstn/line/18', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/2/2f/Channel_3_Thailand_Logo.svg/200px-Channel_3_Thailand_Logo.svg.png' },
                { name: 'CH5™(3BB)', url: 'https://thaipbs-live.cdn.byteark.com/live/playlist.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/2/22/Logo_TV5_Thailand.png' },
                { name: 'CH7™(thaimomo-MX)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/3/36/Channel_7_Thailand_%282003-2561%29.svg/200px-Channel_7_Thailand_%282003-2561%29.svg.png' },
                { name: 'MCOT™(3BB)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/a/ab/MCOT_HD_Logo.svg/200px-MCOT_HD_Logo.svg.png' },
                { name: 'NBT ภาคใต้', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/8/8c/NBT2HD_Logo.png' },
                { name: 'Thai PBS™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/4/45/Thai_PBS_Logo_%282018%29.svg/200px-Thai_PBS_Logo_%282018%29.svg.png' },
                { name: 'Nation 22', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/1/1a/NationTV22_Logo.svg/200px-NationTV22_Logo.svg.png' },
                { name: 'WorkPoint™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/2/29/Workpoint_TV_Logo.svg/200px-Workpoint_TV_Logo.svg.png' },
                { name: 'Thairath™(3BB)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/b/b2/Thairath_TV_HD_Logo.svg/200px-Thairath_TV_HD_Logo.svg.png' },
                { name: 'Amarin TV™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/6/6c/Amarin_TV_Logo.svg/200px-Amarin_TV_Logo.svg.png' },
                { name: 'PPTV™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/8/84/PPTV_HD_36_Logo.svg/200px-PPTV_HD_36_Logo.svg.png' },
                { name: 'True4U™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/d/d4/True4u_Logo_2020.svg/200px-True4u_Logo_2020.svg.png' },
                { name: 'GMM25™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/3/30/GMM25_Logo.svg/200px-GMM25_Logo.svg.png' },
                { name: 'Mono29™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/b/b8/Mono29_Logo.svg/200px-Mono29_Logo.svg.png' },
                { name: 'One31™', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: 'https://upload.wikimedia.org/wikipedia/th/thumb/9/91/One_31_Logo.svg/200px-One_31_Logo.svg.png' }
            ],
            cartoon: [
                { name: 'Cartoon Network', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' },
                { name: 'Disney Channel', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }
            ],
            thaisport: [
                { name: 'T-Sport 7', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }
            ],
            globalsport: [
                { name: 'BeIN Sports 1', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }
            ],
            movie: [{ name: 'Mono Film', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }],
            docu: [{ name: 'Animal Planet', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }],
            news: [{ name: 'Top News', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }],
            test: [{ name: 'Test Stream 1', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', logo: '' }]
        };

        let currentCategory = 'digital';
        let currentChannelIndex = 0;
        let hlsInstance = null;
        let aspectRatioMode = 0;
        let rotationAngle = 0;
        let hudTimeout = null;

        function renderChannels(category) {
            currentCategory = category;
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';
            const list = channelsData[category] || [];
            
            list.forEach((ch, idx) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => playChannel(idx);
                
                const logoDiv = document.createElement('div');
                logoDiv.className = 'channel-logo';
                if (ch.logo) {
                    const img = document.createElement('img');
                    img.src = ch.logo;
                    img.onerror = () => { img.remove(); logoDiv.innerText = '📺'; };
                    logoDiv.appendChild(img);
                } else {
                    logoDiv.innerText = '📺';
                }

                const nameDiv = document.createElement('div');
                nameDiv.className = 'channel-name';
                nameDiv.innerText = ch.name;

                card.appendChild(logoDiv);
                card.appendChild(nameDiv);
                grid.appendChild(card);
            });
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderChannels(cat);
        }

        function playChannel(index) {
            currentChannelIndex = index;
            const ch = channelsData[currentCategory][index];
            openPlayer(ch.url, ch.name);
        }

        function playCustomLink() {
            const url = document.getElementById('customStreamUrl').value.trim();
            if (!url) {
                alert('กรุณากรอกลิงก์สตรีมก่อนครับ');
                return;
            }
            openPlayer(url, 'Custom Media Link');
        }

        function openPlayer(url, title) {
            document.getElementById('currentPlayingTitle').innerText = 'กำลังเล่น: ' + title;
            document.getElementById('player-overlay').classList.add('active');
            
            const video = document.getElementById('videoPlayer');
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // รองรับการเล่นทุกไฟล์ทุกลิงก์ (.m3u8, .mp4, .mkv, .ts, .mov, ฯลฯ)
            if (url.includes('.m3u8') || url.includes('m3u')) {
                if (isIOS || video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                } else if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                } else {
                    video.src = url;
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                }
            } else {
                video.src = url;
                video.play().catch(e => console.log("Autoplay blocked:", e));
            }

            resetHudTimer();
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.currentTime = 0;
            video.src = '';
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            document.getElementById('player-overlay').classList.remove('active');
        }

        function toggleHud() {
            const hud = document.getElementById('playerHud');
            hud.classList.toggle('hidden');
            if (!hud.classList.contains('hidden')) {
                resetHudTimer();
            }
        }

        function resetHudTimer() {
            clearTimeout(hudTimeout);
            const hud = document.getElementById('playerHud');
            hud.classList.remove('hidden');
            hudTimeout = setTimeout(() => {
                hud.classList.add('hidden');
            }, 5000);
        }

        function toggleNativeFullscreen() {
            const video = document.getElementById('videoPlayer');
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            } else if (video.requestFullscreen) {
                video.requestFullscreen();
            }
        }

        function changeAspectRatio() {
            const video = document.getElementById('videoPlayer');
            aspectRatioMode = (aspectRatioMode + 1) % 3;
            video.className = '';
            if (aspectRatioMode === 1) {
                video.classList.add('fill');
                alert('สัดส่วน: เต็มพื้นที่จอ (Fill/Zoom)');
            } else if (aspectRatioMode === 2) {
                video.classList.add('stretch');
                alert('สัดส่วน: ยืดเต็มจอ (Stretch)');
            } else {
                video.classList.add('fit');
                alert('สัดส่วน: พอดีจอ (Fit)');
            }
        }

        function rotatePlayer() {
            rotationAngle = (rotationAngle + 90) % 360;
            const container = document.getElementById('videoContainer');
            container.style.transform = `rotate(${rotationAngle}deg)`;
            container.style.width = (rotationAngle === 90 || rotationAngle === 270) ? '100vh' : '100vw';
            container.style.height = (rotationAngle === 90 || rotationAngle === 270) ? '100vw' : '100vh';
        }

        function promptChangeLink() {
            const newUrl = prompt('แก้ไขลิงก์สตรีมของช่องนี้:');
            if (newUrl) {
                channelsData[currentCategory][currentChannelIndex].url = newUrl;
                openPlayer(newUrl, channelsData[currentCategory][currentChannelIndex].name);
            }
        }

        function addM3UPlaylist() {
            const m3uText = prompt('วางเนื้อหาเพลย์ลิสต์ M3U หรือลิงก์ไฟล์ M3U ที่นี่:');
            if (m3uText) {
                alert('เพิ่มเพลย์ลิสต์สำเร็จ!');
            }
        }

        // ระบบปัดหน้าจอเพื่อย้อนกลับ (Swipe to Go Back)
        let touchStartX = 0;
        let touchStartY = 0;
        const playerOverlay = document.getElementById('player-overlay');

        playerOverlay.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        playerOverlay.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = Math.abs(touchEndY - touchStartY);

            if (touchStartX < 80 && diffX > 80 && diffY < 100) {
                closePlayer();
            }
        }, { passive: true });

        window.onload = () => {
            renderChannels('digital');
        };
    </script>
</body>
</html>
